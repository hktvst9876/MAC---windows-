name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (Qt offscreen, PortAudio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Use a self-contained cryptography wheel (Intel Mac)
        # cryptography 49+ has no x86_64 macOS wheels; a source build links Homebrew's
        # OpenSSL dynamically, which clashes with other bundled copies of libssl.
        if: matrix.target == 'macos-x64'
        run: pip install --only-binary=cryptography "cryptography>=41,<49"
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV; else echo "VERSION=0.1.0" >> $GITHUB_ENV; fi
      - name: Icons
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icons.py
      - name: macOS icon
        if: runner.os == 'macOS'
        run: iconutil -c icns packaging/icons/MirrorBridge.iconset -o packaging/icons/MirrorBridge.icns
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/mirrorbridge.spec
      - name: Smoke test (built app)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/MirrorBridge/MirrorBridge.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then EXE=dist/MirrorBridge.app/Contents/MacOS/MirrorBridge
          else EXE=dist/MirrorBridge/MirrorBridge; fi
          python tools/smoke_test.py "$EXE"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MirrorBridge -DestinationPath "dist/MirrorBridge-$env:VERSION-windows-x64.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\installer.iss
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/MirrorBridge.app || true
          hdiutil create -volname MirrorBridge -srcfolder dist/MirrorBridge.app -ov -format UDZO "dist/MirrorBridge-$VERSION-${{ matrix.target }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorBridge-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
