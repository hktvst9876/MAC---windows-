[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrorbridge"
version = "0.1.0"
description = "AirPlay screen-mirroring receiver for Windows and macOS"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "av>=12.0",
    "zeroconf>=0.120",
    "cryptography>=41",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mirrorbridge = "mirrorbridge.app:main"

[tool.setuptools.packages.find]
include = ["mirrorbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
